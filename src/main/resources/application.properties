# Conexão com o Postgres. Em produção, aponte para o Supabase:
#   direto (exige IPv6):        jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
#   Supavisor sessão (só IPv4):  jdbc:postgresql://postgres.<ref>:SENHA@aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
# Sem SUPABASE_DB_URL o backend usa VIPPELA_DB_URL (Postgres local).
spring.datasource.url=${SUPABASE_DB_URL:${VIPPELA_DB_URL}}
spring.datasource.username=${SUPABASE_DB_USER:${VIPPELA_DB_USER}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${VIPPELA_DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
server.port=${PORT:8080}

# Cadastro e login.
vippela.auth.token-ttl-hours=${VIPPELA_AUTH_TTL_HOURS:720}
vippela.auth.max-tentativas=${VIPPELA_AUTH_MAX_TENTATIVAS:10}
vippela.auth.janela-tentativas-minutos=${VIPPELA_AUTH_JANELA_MINUTOS:15}

# Login com Google. Caminho do JSON de service account do Firebase
# (Project settings > Service accounts > Generate new private key).
vippela.google.credentials=${VIPPELA_GOOGLE_CREDENTIALS:}
