spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${VIPPELA_DB_URL:jdbc:postgresql://localhost:5432/vippela_db}
spring.datasource.username=${VIPPELA_DB_USER:postgres}
spring.datasource.password=${VIPPELA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8080}

vippela.google.credentials=${VIPPELA_GOOGLE_CREDENTIALS:}
