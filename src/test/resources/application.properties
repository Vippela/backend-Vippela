spring.datasource.url=jdbc:h2:mem:vippela;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Cadastro e login em teste: janela curta para exercitar expiração e limite.
vippela.auth.token-ttl-hours=1
vippela.auth.max-tentativas=3
vippela.auth.janela-tentativas-minutos=15
vippela.google.credentials=
